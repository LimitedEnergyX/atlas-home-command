[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-orchestrator"
version = "0.1.0"
description = "Local-only Atlas multi-model orchestration sandbox"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.10,<4", "tzdata>=2025.2"]

[project.scripts]
atlas-orchestrator = "atlas_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atlas_orchestrator = ["web/*", "AI_RULES.md"]
